name: Pre-release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Diff against the pre-push commit so multi-commit pushes are covered;
          # fall back to HEAD~1, then the empty tree on the very first commit.
          EMPTY_TREE=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            BASE=HEAD~1
          else
            BASE="$EMPTY_TREE"
          fi
          echo "Diff base: $BASE"
          CHANGED=$(git diff --name-only "$BASE" HEAD)

          PKGS=()
          for DIR in packages/*/; do
            PKG=$(basename "$DIR")
            [ -f "$DIR/package.json" ] || continue
            if echo "$CHANGED" | grep -q "^packages/$PKG/"; then
              PKGS+=("$PKG")
            fi
          done

          if [ ${#PKGS[@]} -eq 0 ]; then
            echo "No package changes — skipping pre-release."
            echo 'packages=[]' >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s\n' "${PKGS[@]}" | jq -R . | jq -sc .)
            echo "Changed packages: $JSON"
            echo "packages=$JSON" >> "$GITHUB_OUTPUT"
          fi

  prerelease:
    needs: detect
    if: needs.detect.outputs.packages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize to avoid tag-count races when multiple packages change in one push
    strategy:
      max-parallel: 1
      matrix:
        package: ${{ fromJson(needs.detect.outputs.packages) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.package }}
        run: npm run build --workspace=packages/${{ matrix.package }}

      - name: Verify archive
        run: scripts/verify-archive.sh ${{ matrix.package }}

      - name: Determine pre-release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG="${{ matrix.package }}"
          VERSION=$(jq -r '.version' "packages/$PKG/package.json")

          git fetch --tags

          # Fail if a production release for this version already exists
          if git tag -l "${PKG}-v${VERSION}" | grep -q .; then
            echo "::error::[$PKG] v$VERSION is already a production release. Bump package.json to a higher version before merging."
            exit 1
          fi

          # Fail if version is not newer than the latest production release
          LATEST_PROD=$(git tag -l "${PKG}-v[0-9]*" | grep -v '\-rc\.' | sort -V | tail -1 | sed "s/${PKG}-v//")
          if [ -n "$LATEST_PROD" ]; then
            HIGHER=$(printf '%s\n%s\n' "$LATEST_PROD" "$VERSION" | sort -V | tail -1)
            if [ "$VERSION" = "$LATEST_PROD" ] || [ "$HIGHER" != "$VERSION" ]; then
              echo "::error::[$PKG] v$VERSION is not newer than the current production release v$LATEST_PROD."
              exit 1
            fi
            echo "[$PKG] v$VERSION > v$LATEST_PROD ✓"
          fi

          # Count existing rc tags for this package+version to derive next N
          N=$(git tag -l "${PKG}-v${VERSION}-rc.*" | wc -l | tr -d ' ')
          NEXT=$((N + 1))

          TAG="${PKG}-v${VERSION}-rc.${NEXT}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Pre-release tag: $TAG"

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG="${{ matrix.package }}"
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.tag.outputs.version }}"
          ASSET="packages/$PKG/${PKG}-${VERSION}.tar.gz"

          # Another run (a near-simultaneous merge) can claim the same rc number.
          # gh fails if a release for the tag already exists, so recompute and retry.
          for ATTEMPT in 1 2 3 4 5; do
            if gh release create "$TAG" \
              --title "$TAG" \
              --notes "Pre-release build of $PKG v$VERSION ($(git rev-parse --short "$GITHUB_SHA"))" \
              --target "$GITHUB_SHA" \
              --prerelease \
              "$ASSET"; then
              exit 0
            fi

            echo "::warning::[$PKG] could not create $TAG (attempt $ATTEMPT) — recomputing rc number"
            sleep $((ATTEMPT * 3))
            git fetch --tags --force
            N=$(git tag -l "${PKG}-v${VERSION}-rc.*" | wc -l | tr -d ' ')
            TAG="${PKG}-v${VERSION}-rc.$((N + 1))"
          done

          echo "::error::[$PKG] failed to create a pre-release after 5 attempts"
          exit 1
